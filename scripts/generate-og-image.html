<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>McCoin OG Image Generator</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: 'Arial', sans-serif;
        background: #f0f0f0;
      }

      .og-container {
        width: 1200px;
        height: 630px;
        background: linear-gradient(135deg, #07153b 0%, #0a1a4a 50%, #0d1f57 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        margin: 0 auto;
      }

      .content {
        text-align: center;
        color: white;
        z-index: 2;
      }

      .logo {
        width: 200px;
        height: 200px;
        background: white;
        border-radius: 20px;
        margin: 0 auto 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        font-weight: bold;
        color: #07153b;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .title {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #dae6ea;
      }

      .subtitle {
        font-size: 24px;
        color: #dae6ea;
        opacity: 0.9;
        max-width: 800px;
        margin: 0 auto;
      }

      .bg-pattern {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.1;
        background-image: radial-gradient(circle at 25% 25%, #dae6ea 2px, transparent 2px),
          radial-gradient(circle at 75% 75%, #dae6ea 2px, transparent 2px);
        background-size: 60px 60px;
      }

      .instructions {
        margin-top: 30px;
        text-align: center;
        color: #666;
      }

      button {
        background: #07153b;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin: 10px;
      }

      button:hover {
        background: #0a1a4a;
      }
    </style>
  </head>
  <body>
    <div class="og-container" id="ogImage">
      <div class="bg-pattern"></div>
      <div class="content">
        <div class="logo">McCoin</div>
        <div class="title">Everything Crypto</div>
        <div class="subtitle">Global Cryptocurrency Exchange Platform</div>
      </div>
    </div>

    <div class="instructions">
      <h3>Instructions:</h3>
      <p>1. Right-click on the image above and select "Save as image" or take a screenshot</p>
      <p>2. Save it as <strong>og-image.png</strong> in your <strong>public/</strong> folder</p>
      <p>3. The image is already sized at 1200x630px (optimal for Open Graph)</p>
      <button onclick="downloadImage()">Download as PNG</button>
    </div>

    <script>
      function downloadImage() {
        // This is a simple approach - you might need to use html2canvas library for better results
        alert(
          'Right-click on the image above and select "Save as image" or use a screenshot tool to capture the exact 1200x630px area.',
        );
      }
    </script>
  </body>
</html>
