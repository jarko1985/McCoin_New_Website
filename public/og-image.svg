<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07153B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0A2E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EC3B3B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="50" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="80" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="200" cy="500" r="30" fill="url(#accentGradient)" opacity="0.2"/>
  
  <!-- Main content area -->
  <g transform="translate(100, 150)">
    <!-- Logo placeholder -->
    <rect x="0" y="0" width="120" height="120" rx="20" fill="url(#accentGradient)"/>
    <text x="60" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">MC</text>
    
    <!-- Title -->
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white">McCoin</text>
    <text x="150" y="90" font-family="Arial, sans-serif" font-size="32" fill="#EC3B3B">Virtual Assets</text>
    
    <!-- Subtitle -->
    <text x="150" y="140" font-family="Arial, sans-serif" font-size="24" fill="#CCCCCC">Your Trusted Crypto Exchange Platform</text>
    
    <!-- Features -->
    <g transform="translate(0, 200)">
      <circle cx="15" cy="15" r="8" fill="url(#accentGradient)"/>
      <text x="35" y="22" font-family="Arial, sans-serif" font-size="18" fill="white">Secure Trading</text>
      
      <circle cx="15" cy="55" r="8" fill="url(#accentGradient)"/>
      <text x="35" y="62" font-family="Arial, sans-serif" font-size="18" fill="white">24/7 Support</text>
      
      <circle cx="15" cy="95" r="8" fill="url(#accentGradient)"/>
      <text x="35" y="102" font-family="Arial, sans-serif" font-size="18" fill="white">Global Access</text>
    </g>
  </g>
  
  <!-- Bottom accent -->
  <rect x="0" y="580" width="1200" height="50" fill="url(#accentGradient)"/>
  <text x="600" y="610" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">Trade with Confidence</text>
</svg>
