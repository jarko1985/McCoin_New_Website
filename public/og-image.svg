<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07153B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0A2E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EC3B3B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="50" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="80" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="200" cy="500" r="30" fill="url(#accentGradient)" opacity="0.2"/>
  <circle cx="1000" cy="150" r="40" fill="url(#goldGradient)" opacity="0.15"/>
  
  <!-- Main content area -->
  <g transform="translate(100, 150)">
    <!-- Logo placeholder with enhanced design -->
    <rect x="0" y="0" width="120" height="120" rx="20" fill="url(#accentGradient)"/>
    <text x="60" y="75" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">MC</text>
    
    <!-- Title with enhanced typography -->
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">McCoin</text>
    <text x="150" y="90" font-family="Arial, sans-serif" font-size="36" fill="#EC3B3B" font-weight="600">Everything Crypto</text>
    
    <!-- Enhanced subtitle -->
    <text x="150" y="140" font-family="Arial, sans-serif" font-size="28" fill="#CCCCCC">Global Cryptocurrency Exchange Platform</text>
    
    <!-- Enhanced features with icons -->
    <g transform="translate(0, 200)">
      <!-- Secure Trading -->
      <circle cx="15" cy="15" r="10" fill="url(#accentGradient)"/>
      <text x="40" y="22" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="600">🔒 Secure Trading</text>
      
      <!-- Zero Fees -->
      <circle cx="15" cy="60" r="10" fill="url(#goldGradient)"/>
      <text x="40" y="67" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="600">💰 Zero Fees</text>
      
      <!-- Global Access -->
      <circle cx="15" cy="105" r="10" fill="url(#accentGradient)"/>
      <text x="40" y="112" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="600">🌍 Global Access</text>
      
      <!-- 24/7 Support -->
      <circle cx="15" cy="150" r="10" fill="url(#goldGradient)"/>
      <text x="40" y="157" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="600">🛡️ 24/7 Support</text>
    </g>
  </g>
  
  <!-- Crypto symbols decoration -->
  <g transform="translate(800, 200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="40" fill="white" opacity="0.3">₿</text>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="35" fill="white" opacity="0.3">Ξ</text>
    <text x="100" y="10" font-family="Arial, sans-serif" font-size="30" fill="white" opacity="0.3">◎</text>
  </g>
  
  <!-- Bottom accent with enhanced design -->
  <rect x="0" y="580" width="1200" height="50" fill="url(#accentGradient)"/>
  <text x="600" y="610" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">Start Your Crypto Journey Today</text>
  
  <!-- URL display -->
  <text x="600" y="640" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#CCCCCC" opacity="0.8">mc-coin-new-website.vercel.app</text>
</svg>

